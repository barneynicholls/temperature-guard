; Temperature Guard: ESP32-S3 Feather + DHT11 + SPI SD, frost-guard heater controller

[env:feather-s3]
board = adafruit_feather_esp32s3
platform = espressif32@7.0.1  ; pinned: newer Arduino-ESP32 3.x cores change APIs used here
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	bblanchon/ArduinoJson@^7.2.0
build_flags =
	-DCORE_DEBUG_LEVEL=2
	-DARDUINO_USB_CDC_ON_BOOT=1
